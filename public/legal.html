<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Legal | Vaidya Gogate Memorial Foundation</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/vgmf-site.css">
    <link rel="stylesheet" href="/css/vgmf-responsive.css?v=20260520c">
    <style>
        body.legal-page { background: #f8fafc; color: #0f172a; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; margin: 0; }
        .legal-wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
        .legal-back { display: inline-flex; align-items: center; gap: 8px; color: #0f766e; font-weight: 700; text-decoration: none; margin-bottom: 18px; }
        .legal-back:hover { text-decoration: underline; }
        .legal-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,0.06); padding: 24px; }
        .legal-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .legal-nav-link { display: inline-block; padding: 8px 14px; border-radius: 999px; background: #ecfdf5; color: #115e59; font-size: 0.88rem; font-weight: 700; text-decoration: none; border: 1px solid #99f6e4; }
        .legal-nav-link.is-active { background: #0f766e; color: #fff; border-color: #0f766e; }
        .legal-nav-link:hover { text-decoration: none; filter: brightness(0.98); }
        #legal-title { font-family: Fraunces, Georgia, serif; font-size: 1.75rem; color: #0f766e; margin: 0 0 16px; line-height: 1.25; }
        #legal-body { line-height: 1.7; color: #334155; font-size: 0.98rem; }
        #legal-body p { margin: 0 0 14px; }
        #legal-status { color: #b91c1c; font-size: 0.9rem; margin-top: 12px; }
        .legal-footer-note { margin-top: 24px; font-size: 0.82rem; color: #64748b; text-align: center; }
    </style>
</head>
<body class="legal-page">
    <div class="legal-wrap">
        <a href="/" class="legal-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to main site</a>
        <div class="legal-card">
            <nav id="legal-nav" class="legal-nav" aria-label="Legal policies"></nav>
            <h1 id="legal-title">Loading…</h1>
            <div id="legal-body"></div>
            <p id="legal-status"></p>
        </div>
        <p class="legal-footer-note">Content is managed by the Foundation administrators and may be updated from time to time.</p>
    </div>
    <script src="/js/portal-website-menu.js?v=20260611legal2"></script>
    <script src="/js/legal-page.js?v=20260611legal2" defer></script>
</body>
</html>
