<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7c2d12">
    <title>VGMF Venue Gate</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/scanner-portal.css">
    <style>
        :root { --scan-accent: #7c2d12; --scan-accent-soft: #ea580c; }
        .face-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .face-compare img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 2px solid var(--scan-line); }
        .face-compare span { display: block; font-size: 0.72rem; text-align: center; color: var(--scan-muted); margin-top: 4px; }
    </style>
</head>
<body class="scanner-body">
    <div id="auth-overlay" class="auth-overlay-scanner">
        <div class="auth-card-scanner">
            <div class="auth-brand" data-site-logo data-logo-height="56px" aria-hidden="true"></div>
            <h2><i class="fas fa-door-open"></i> Venue gate</h2>
            <p class="auth-sub">Scan DigiYatra-style venue passes · separate from e-ticket scanner.</p>
            <form id="gate-login-form" autocomplete="off">
                <label for="gate-email">Email</label>
                <input type="email" id="gate-email" required autocomplete="username">
                <label for="gate-password">Password</label>
                <input type="password" id="gate-password" required autocomplete="current-password">
                <p id="gate-login-err" class="login-err hidden"></p>
                <button type="submit" class="tool-btn primary auth-submit">Sign in</button>
            </form>
            <p class="auth-foot">Venue gate staff · <a href="/scanner.html">E-ticket scanner</a></p>
        </div>
    </div>

    <div id="gate-ui" class="scanner-shell hidden">
        <header class="scanner-top">
            <div class="scanner-top-main">
                <p class="scanner-eyebrow">Venue gate (DigiYatra)</p>
                <h1>Scan venue pass</h1>
                <p class="who" id="gate-who"></p>
            </div>
            <button type="button" class="tool-btn scanner-logout" id="gate-logout"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <div class="scan-card scan-card-highlight">
            <label for="gate-seminar-select"><i class="fas fa-calendar-check"></i> Seminar</label>
            <select id="gate-seminar-select"></select>
        </div>

        <div class="camera-wrap">
            <div id="gate-reader"></div>
            <p class="camera-hint">Scan VE: venue pass QR</p>
        </div>

        <div id="gate-result" class="hidden"></div>

        <div class="scan-card">
            <label for="gate-manual"><i class="fas fa-keyboard"></i> Manual pass token</label>
            <div class="manual-row">
                <input type="text" id="gate-manual" placeholder="VE:… or pass token">
                <button type="button" class="tool-btn primary" id="gate-manual-btn">Lookup</button>
            </div>
        </div>
    </div>

    <script src="/js/portal-content-protection.js"></script>
    <script src="/js/site-branding.js"></script>
    <script src="/js/portal-auth.js"></script>
    <script src="/js/venue-gate.js"></script>
</body>
</html>
