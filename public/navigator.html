<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navigator</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
        header { background: #9a3412; color: #fff; padding: 14px 16px; }
        main { max-width: 720px; margin: 0 auto; padding: 16px; }
        section, article { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin: 0 0 12px; }
        label { display: block; font-size: 0.82rem; margin: 8px 0; }
        input, select, button { font: inherit; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #9a3412; color: #fff; border: 0; border-radius: 8px; padding: 10px 12px; font-weight: 700; margin: 4px 4px 0 0; }
        .muted { color: #64748b; font-size: 0.84rem; }
        .msg { font-weight: 700; }
        img.qr { width: 220px; height: 220px; object-fit: contain; background: #fff; }
    </style>
</head>
<body>
<header>
    <strong>Navigator</strong>
    <div id="who" class="muted"></div>
</header>
<main>
    <section id="login">
        <h2>Agent sign in</h2>
        <label>Email<input id="email" type="email" autocomplete="username"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password"></label>
        <button type="button" id="signin">Sign in</button>
        <p id="login-msg" class="msg"></p>
    </section>
    <div id="app" hidden>
        <section>
            <h2>Runsheet</h2>
            <div id="runsheet"></div>
        </section>
        <section>
            <h2>Hyperlocal</h2>
            <div id="offers"></div>
        </section>
    </div>
</main>
<script src="/js/navigator.js?v=20261005hubs"></script>
</body>
</html>
