<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track your VGMF seminar book courier shipment — live updates by order code and AWB.">
    <title>Track shipment — Vaidya Gogate Memorial Foundation</title>
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="canonical" href="https://seminar.vaidyagogate.org/track-shipment">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/book-track.css?v=20261022v4">
    <link rel="stylesheet" href="/css/track-shipment-v4.css?v=20261022v7">
    <link rel="stylesheet" href="/css/track-timeline.css?v=20261022v7">
    <script src="/js/site-seo.js?v=20260608seo2"></script>
    <script src="/js/portal-datetime.js?v=1"></script>
</head>
<body class="ts4">
    <div class="pkg-track-page ts4-page">
        <header class="ts4-top">
            <a class="ts4-brand" href="https://seminar.vaidyagogate.org"><i class="fas fa-box-open"></i> Gogate Products</a>
            <span class="ts4-top-sub">Shipment tracking</span>
        </header>

        <section class="pkg-track-search ts4-search" id="track-shipment-search">
            <div class="ts4-search-copy">
                <h1>Track your shipment</h1>
                <p>Enter your order code with the AWB or the last 4 digits of the shipping mobile number.</p>
            </div>
            <form id="track-shipment-form" autocomplete="off" class="ts4-form">
                <label><span>Order code</span><input type="text" id="ts-order-code" name="orderCode" placeholder="e.g. BKMV…" required></label>
                <label><span>AWB / tracking no.</span><input type="text" id="ts-awb" name="awb" placeholder="Courier AWB"></label>
                <label><span>or mobile (last 4)</span><input type="text" id="ts-phone" name="phoneLast4" maxlength="4" inputmode="numeric" placeholder="7890"></label>
                <button type="submit"><i class="fas fa-location-arrow"></i> Track</button>
            </form>
            <p id="track-shipment-err" class="pkg-track-err hidden"></p>
        </section>

        <div id="track-shipment-result" class="hidden"></div>
        <p id="track-shipment-poll" class="hidden" style="text-align:center;font-size:0.82rem;color:#0f766e;font-weight:700;margin-top:12px;">
            Updates when you refresh
        </p>
    </div>
    <script src="/js/book-tracking-ui.js?v=20260529stg"></script>
    <script src="/js/track-timeline.js?v=20261022v3"></script>
    <script src="/js/track-shipment.js?v=20261022v7"></script>
</body>
</html>
