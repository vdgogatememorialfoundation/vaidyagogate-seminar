<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Book shop</title>
    <link rel="stylesheet" href="/css/track-timeline.css?v=20261003tl">
    <link rel="stylesheet" href="/css/shop.css?v=20261029shop3">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<a class="skip" href="#view-home">Skip to the books</a>
<div class="announce" id="shop-announce"></div>
<header class="mast">
    <div class="topbar">
        <button type="button" class="brand" onclick="shopGo('home')">
            <span class="brand-mark" aria-hidden="true">VG</span>
            <span class="brand-text"><span id="store-name">Book shop</span><small>Seminar texts · Dr. R.B. Gogate</small></span>
        </button>
        <div class="search-wrap">
            <form class="searchbar" onsubmit="shopSearch(event)">
                <input id="shop-search" type="search" placeholder="Search title, author, or language" autocomplete="off" oninput="shopSuggest()" onfocus="shopSuggest()">
                <button type="submit">Search</button>
            </form>
            <div id="search-suggest" class="suggest hidden"></div>
        </div>
        <button type="button" class="top-link" onclick="shopGo('saved')"><span>Saved</span><strong>Wishlist <span id="wish-count">0</span></strong></button>
        <button type="button" class="top-link" onclick="shopGo('account')"><span id="hello-line">Hello, sign in</span><strong>Account &amp; orders</strong></button>
        <button type="button" class="top-link cart-link" onclick="openCartDrawer()" aria-label="Open cart">
            Cart <span class="cart-count" id="cart-count">0</span>
        </button>
    </div>
    <nav class="subnav">
        <button type="button" id="nav-home" onclick="shopGo('home')">Shop</button>
        <button type="button" id="nav-saved" onclick="shopGo('saved')">Saved</button>
        <button type="button" id="nav-orders" onclick="shopGo('account','orders')">Orders</button>
        <button type="button" id="nav-addresses" onclick="shopGo('account','address')">Addresses</button>
        <button type="button" id="nav-help" onclick="shopGo('help')">Delivery &amp; help</button>
        <span class="hours" id="shop-hours"></span>
    </nav>
</header>
<div class="trust" id="shop-trust"></div>
<div id="closed-banner" class="closed-banner hidden"></div>

<main class="wrap">
    <section id="view-home"></section>
    <section id="view-book" class="hidden"></section>
    <section id="view-saved" class="hidden"></section>
    <section id="view-help" class="hidden"></section>
    <section id="view-checkout" class="hidden"></section>
    <section id="view-login" class="hidden"></section>
    <section id="view-account" class="hidden"></section>
    <section id="view-order" class="hidden"></section>
</main>

<footer class="footer" id="shop-footer"></footer>
<nav class="dock" aria-label="Shop">
    <button type="button" onclick="shopGo('home')">Shop</button>
    <button type="button" onclick="shopGo('saved')">Saved</button>
    <button type="button" onclick="openCartDrawer()">Cart <span id="dock-count">0</span></button>
    <button type="button" onclick="shopGo('account')">Account</button>
</nav>

<div id="drawer-mask" class="drawer-mask hidden" onclick="closeCartDrawer()"></div>
<aside id="cart-drawer" class="drawer hidden" aria-label="Shopping cart">
    <header>Your cart <button type="button" onclick="closeCartDrawer()" aria-label="Close">&times;</button></header>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div id="pdp-mask" class="drawer-mask hidden" onclick="closeProduct()"></div>
<aside id="pdp" class="drawer pdp hidden" aria-label="Book details">
    <header>Quick view <button type="button" onclick="closeProduct()" aria-label="Close">&times;</button></header>
    <div class="drawer-body" id="pdp-body"></div>
</aside>

<script src="/js/track-timeline.js?v=20261003tl"></script>
<script src="/js/shop.js?v=20261029shop3"></script>
</body>
</html>
