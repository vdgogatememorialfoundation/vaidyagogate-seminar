<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event | VGMF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/vgmf-public-premium.css">
    <style>
        body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
        .event-wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 48px; }
        .event-hero { background: linear-gradient(135deg, #0f766e, #134e4a); color: #f0fdfa; border-radius: 16px; padding: 32px 28px; margin-bottom: 24px; }
        .event-hero.has-image { background-size: cover; background-position: center; min-height: 200px; }
        .event-hero h1 { margin: 0 0 10px; font-size: 1.75rem; }
        .event-hero p { margin: 0; opacity: 0.92; }
        .event-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .event-section h3 { margin: 0 0 10px; color: #0f766e; font-size: 1.1rem; }
        .event-section p { margin: 0; line-height: 1.6; color: #475569; white-space: pre-wrap; }
        .event-section img { max-width: 100%; border-radius: 10px; margin-top: 12px; }
        .event-meta { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; font-size: 0.9rem; color: #475569; }
        .btn { display: inline-block; padding: 12px 20px; border-radius: 10px; font-weight: 700; text-decoration: none; background: #0d9488; color: #fff; border: none; cursor: pointer; }
        .btn.secondary { background: #64748b; margin-left: 8px; }
        .err { color: #b91c1c; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="event-wrap">
        <div id="event-loading" style="text-align:center;color:#64748b;padding:40px;">Loading event…</div>
        <div id="event-content" class="hidden">
            <div class="event-hero" id="event-hero">
                <h1 id="event-title">Event</h1>
                <p id="event-subtitle"></p>
            </div>
            <div class="event-card">
                <div class="event-meta">
                    <span id="event-date"></span>
                    <span id="event-price"></span>
                </div>
                <p id="event-terms" style="font-size:0.9rem;color:#64748b;white-space:pre-wrap;"></p>
                <div style="margin-top:20px;">
                    <a id="event-register-btn" class="btn" href="#">Register</a>
                    <a class="btn secondary" href="/">Main website</a>
                </div>
            </div>
            <div id="event-sections"></div>
        </div>
        <p id="event-error" class="err hidden"></p>
    </div>
    <script>
        (async function () {
            const slug =
                new URLSearchParams(location.search).get('event') ||
                (location.pathname.match(/\/event\/([^/]+)/) || [])[1] ||
                '';
            const loading = document.getElementById('event-loading');
            const content = document.getElementById('event-content');
            const errEl = document.getElementById('event-error');
            if (!slug) {
                loading.classList.add('hidden');
                errEl.textContent = 'Missing event slug in URL (?event=your-slug)';
                errEl.classList.remove('hidden');
                return;
            }
            try {
                const res = await fetch('/api/public/event/' + encodeURIComponent(slug));
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Event not found');
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                const page = data.page || {};
                document.getElementById('event-title').textContent = page.heroTitle || data.title || 'Event';
                document.getElementById('event-subtitle').textContent =
                    page.heroSubtitle || (data.registrationEnabled ? 'Registration open' : 'Information only');
                const hero = document.getElementById('event-hero');
                if (page.heroImage && hero) {
                    hero.classList.add('has-image');
                    hero.style.backgroundImage =
                        'linear-gradient(135deg, rgba(15,118,110,0.85), rgba(19,78,74,0.9)), url(' +
                        JSON.stringify(page.heroImage) +
                        ')';
                }
                document.getElementById('event-date').textContent = data.eventDate
                    ? 'Date: ' + new Date(data.eventDate).toLocaleString()
                    : '';
                document.getElementById('event-price').textContent =
                    data.paymentRequired && data.price != null
                        ? 'Fee: ₹' + data.price
                        : data.paymentRequired
                          ? ''
                          : 'No payment required';
                document.getElementById('event-terms').textContent = data.termsConditions || '';
                const regBtn = document.getElementById('event-register-btn');
                if (data.registrationEnabled) {
                    regBtn.href = data.registerUrl || '/doctor.html';
                    regBtn.textContent =
                        data.portalMode === 'standalone' ? 'Sign up for this event' : 'Register in doctor portal';
                } else {
                    regBtn.style.display = 'none';
                }
                const esc = (s) =>
                    String(s == null ? '' : s)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                const secWrap = document.getElementById('event-sections');
                const sections = Array.isArray(page.sections) ? page.sections : [];
                if (secWrap && sections.length) {
                    secWrap.innerHTML = sections
                        .map((s) => {
                            const t = esc((s && s.title) || '');
                            const b = esc((s && s.body) || '');
                            const img =
                                s && s.imageUrl
                                    ? '<img src="' + esc(s.imageUrl) + '" alt="">'
                                    : '';
                            return (
                                '<div class="event-card event-section"><h3>' +
                                t +
                                '</h3><p>' +
                                b +
                                '</p>' +
                                img +
                                '</div>'
                            );
                        })
                        .join('');
                }
                document.title = (data.title || 'Event') + ' | VGMF';
            } catch (e) {
                loading.classList.add('hidden');
                errEl.textContent = e.message || 'Could not load event';
                errEl.classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
